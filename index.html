<script>
(() => {
  'use strict';
  const STORAGE_KEY='kids-learning-adventure-v1';
  const LEVELS=[
    {level:1,name:'認識新朋友',stage:'小一初期',desc:'先看懂、認得，再開始作答。'},
    {level:2,name:'基礎出發',stage:'小一上',desc:'把剛學會的知識連接起來。'},
    {level:3,name:'熟練前進',stage:'小一下',desc:'增加速度，也保持理解。'},
    {level:4,name:'進階探索',stage:'小二上',desc:'把知識放進生活情境。'},
    {level:5,name:'綜合運用',stage:'小二下',desc:'一次使用兩種以上的能力。'},
    {level:6,name:'小小挑戰家',stage:'小二挑戰',desc:'閱讀、推理，再做出判斷。'}
  ];
  const SUBJECTS={
    chinese:{name:'國文森林',short:'國文',icon:'📚',class:'chinese',desc:'注音、國字、詞語與閱讀理解'},
    math:{name:'數學島嶼',short:'數學',icon:'🔢',class:'math',desc:'數量、加減、圖形與生活應用'},
    english:{name:'英文字母城',short:'英文',icon:'🔤',class:'english',desc:'字母、單字、發音與簡單閱讀'}
  };
  const questions=[]; const counters={};
  function add(subject,level,category,prompt,answer,distractors,explanation,speak=''){
    const key=subject+level;counters[key]=(counters[key]||0)+1;
    const prefix={chinese:'C',math:'M',english:'E'}[subject];
    const id=`${prefix}${String(level).padStart(2,'0')}-${String(counters[key]).padStart(3,'0')}`;
    const choices=[answer,...distractors].slice(0,4);
    const shift=(counters[key]+level)%choices.length;
    const rotated=choices.slice(shift).concat(choices.slice(0,shift));
    questions.push({id,subject,level,category,prompt,choices:rotated,answer:rotated.indexOf(answer),explanation,speak});
  }
  function addSet(subject,level,category,rows){rows.forEach(r=>add(subject,level,category,...r));}

  // 國文：LEVEL 01 另含完整的零～十雙向數字國字練習，其餘每級 10 題
  addSet('chinese',1,'注音辨認',[
    ['哪一個是「ㄅ」？','ㄅ',['ㄆ','ㄇ','ㄈ'],'ㄅ的聲音像「爸爸」開頭。'],['哪一個是「ㄆ」？','ㄆ',['ㄅ','ㄊ','ㄇ'],'ㄆ的聲音像「婆婆」開頭。'],['哪一個是「ㄇ」？','ㄇ',['ㄋ','ㄈ','ㄆ'],'ㄇ的聲音像「媽媽」開頭。'],['哪一個是「ㄈ」？','ㄈ',['ㄏ','ㄇ','ㄅ'],'ㄈ的聲音像「飛」開頭。'],['哪一個是「ㄉ」？','ㄉ',['ㄊ','ㄌ','ㄍ'],'ㄉ的聲音像「大」開頭。'],['哪一個是「ㄊ」？','ㄊ',['ㄉ','ㄋ','ㄎ'],'ㄊ的聲音像「他」開頭。'],['哪一個是「ㄋ」？','ㄋ',['ㄌ','ㄇ','ㄊ'],'ㄋ的聲音像「你」開頭。'],['哪一個是「ㄌ」？','ㄌ',['ㄋ','ㄖ','ㄉ'],'ㄌ的聲音像「來」開頭。'],['哪一個是「ㄍ」？','ㄍ',['ㄎ','ㄏ','ㄐ'],'ㄍ的聲音像「哥哥」開頭。'],['哪一個是「ㄎ」？','ㄎ',['ㄍ','ㄏ','ㄑ'],'ㄎ的聲音像「渴」開頭。']
  ]);
  addSet('chinese',1,'數字國字',[
    ['數字0的國字是哪一個？','零',['一','六','十'],'0寫成國字是「零」。'],
    ['數字1的國字是哪一個？','一',['二','七','十'],'1寫成國字是「一」。'],
    ['數字2的國字是哪一個？','二',['三','五','九'],'2寫成國字是「二」。'],
    ['數字3的國字是哪一個？','三',['二','五','八'],'3寫成國字是「三」。'],
    ['數字4的國字是哪一個？','四',['三','五','六'],'4寫成國字是「四」。'],
    ['數字5的國字是哪一個？','五',['二','四','九'],'5寫成國字是「五」。'],
    ['數字6的國字是哪一個？','六',['四','八','十'],'6寫成國字是「六」。'],
    ['數字7的國字是哪一個？','七',['一','九','十'],'7寫成國字是「七」。'],

    ['數字9的國字是哪一個？','九',['六','七','八'],'9寫成國字是「九」。'],
    ['數字10的國字是哪一個？','十',['一','七','九'],'10寫成國字是「十」。'],
    ['國字「零」是哪一個數字？','0',['1','6','10'],'「零」就是數字0。'],
    ['國字「一」是哪一個數字？','1',['2','7','10'],'「一」就是數字1。'],
    ['國字「二」是哪一個數字？','2',['3','5','9'],'「二」就是數字2。'],
    ['國字「三」是哪一個數字？','3',['2','5','8'],'「三」就是數字3。'],

    ['國字「五」是哪一個數字？','5',['2','4','9'],'「五」就是數字5。'],
    ['國字「六」是哪一個數字？','6',['4','8','10'],'「六」就是數字6。'],
    ['國字「七」是哪一個數字？','7',['1','9','10'],'「七」就是數字7。'],
    ['國字「八」是哪一個數字？','8',['3','6','9'],'「八」就是數字8。'],
    ['國字「九」是哪一個數字？','9',['6','7','8'],'「九」就是數字9。'],
    ['國字「十」是哪一個數字？','10',['1','7','9'],'「十」就是數字10。']
  ]);
  addSet('chinese',2,'注音拼讀',[
    ['「貓」的注音是哪一個？','ㄇㄠ',['ㄇㄡ','ㄋㄠ','ㄇㄚ'],'貓讀作ㄇㄠ。'],['「狗」的注音是哪一個？','ㄍㄡ',['ㄎㄡ','ㄍㄠ','ㄉㄡ'],'狗讀作ㄍㄡ。'],['「花」的注音是哪一個？','ㄏㄨㄚ',['ㄏㄨㄛ','ㄍㄨㄚ','ㄏㄚ'],'花讀作ㄏㄨㄚ。'],['「魚」的注音是哪一個？','ㄩˊ',['ㄨˊ','ㄧˊ','ㄩˇ'],'魚讀作ㄩˊ，是第二聲。'],['「鳥」的注音是哪一個？','ㄋㄧㄠˇ',['ㄌㄧㄠˇ','ㄋㄧㄡˇ','ㄋㄧㄠˋ'],'鳥讀作ㄋㄧㄠˇ，是第三聲。'],['「水」的注音是哪一個？','ㄕㄨㄟˇ',['ㄙㄨㄟˇ','ㄕㄨㄟˋ','ㄕㄨㄟˊ'],'水讀作ㄕㄨㄟˇ。'],['「山」的注音是哪一個？','ㄕㄢ',['ㄙㄢ','ㄕㄤ','ㄕㄣ'],'山讀作ㄕㄢ。'],['「月」的注音是哪一個？','ㄩㄝˋ',['ㄧㄝˋ','ㄩㄢˋ','ㄩㄝˊ'],'月讀作ㄩㄝˋ，是第四聲。'],['「日」的注音是哪一個？','ㄖˋ',['ㄌˋ','ㄓˋ','ㄖˊ'],'日讀作ㄖˋ。'],['「雲」的注音是哪一個？','ㄩㄣˊ',['ㄨㄣˊ','ㄩㄥˊ','ㄩㄣˇ'],'雲讀作ㄩㄣˊ。']
  ]);
  addSet('chinese',3,'國字與詞語',[
    ['「ㄕㄢ」是哪一個國字？','山',['水','田','天'],'ㄕㄢ可以寫成「山」。'],['「ㄕㄨㄟˇ」是哪一個國字？','水',['火','木','土'],'ㄕㄨㄟˇ可以寫成「水」。'],['哪一個詞語和「學校」有關？','教室',['廚房','果園','車站'],'教室是學校裡上課的地方。'],['哪一個詞語和「下雨」有關？','雨傘',['鉛筆','枕頭','皮球'],'下雨時可以撐雨傘。'],['「開心」意思最接近哪一個？','快樂',['生氣','害怕','疲倦'],'開心和快樂的意思接近。'],['「巨大」意思最接近哪一個？','很大',['很小','很慢','很輕'],'巨大就是非常大。'],['哪一個字可以和「花」組成詞語？','園',['飯','門','手'],'花園是種植花草的地方。'],['哪一個字可以和「同」組成詞語？','學',['雨','果','水'],'同學是在一起學習的人。'],['「早上」的相反詞較接近哪一個？','晚上',['中午','今天','昨天'],'早上和晚上是一天中相對的時段。'],['哪個詞語使用正確？','一朵花',['一朵魚','一朵狗','一朵筆'],'花可以用「朵」來計數。']
  ]);
  addSet('chinese',4,'句子與量詞',[
    ['桌上有一＿＿書。','本',['隻','朵','條'],'書常用量詞「本」。'],['池塘裡有一＿＿魚。','條',['本','張','棵'],'魚常用量詞「條」。'],['天空中有一＿＿鳥。','隻',['把','間','杯'],'鳥常用量詞「隻」。'],['媽媽買了一＿＿雨傘。','把',['頭','顆','件'],'雨傘常用量詞「把」。'],['哪個句子的順序最通順？','我在公園裡跑步。',['跑步我公園裡在。','公園我跑步在裡。','在跑步公園我裡。'],'人物、地點和動作排列清楚，句子才通順。'],['哪個句子最完整？','小狗在草地上玩球。',['小狗在。','草地玩球。','在草地上。'],'完整句子交代了誰、在哪裡、做什麼。'],['「因為下雨，＿＿。」哪個最合理？','所以我帶雨傘',['所以太陽很大','但是我很口渴','而且書在桌上'],'下雨和帶雨傘有合理的原因結果。'],['「我先洗手，＿＿吃飯。」','再',['也','都','只'],'「先……再……」表示事情的順序。'],['哪一句使用「一起」最合適？','我和妹妹一起畫畫。',['鉛筆一起很長。','天空一起是藍色。','桌子一起有四腳。'],'一起表示兩個人或更多人共同做事。'],['句號「。」通常放在哪裡？','一句話的最後',['每個字前面','名字中間','題目的最前面'],'一句完整的話說完，可以使用句號。']

  function save(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}
  function recordFor(id){return load().records[id]||null;}
  function statsFor(list){const s=load();let answered=0,correct=0,attempts=0,wrong=0;list.forEach(q=>{const r=s.records[q.id];if(r){answered++;attempts+=r.attempts||0;if(r.correct)correct++;if(r.wrong)wrong++;}});return {answered,correct,attempts,wrong,rate:answered?Math.round(correct/answered*100):0};}
  function levelStats(subject,level){return statsFor(questions.filter(q=>q.subject===subject&&q.level===level));}
  function levelTotal(subject,level){return questions.filter(q=>q.subject===subject&&q.level===level).length;}
  function requiredForLevel(subject,level){const total=levelTotal(subject,level);return Math.min(total,Math.max(10,Math.ceil(total*.6)));}
  function currentLevel(subject){for(let l=1;l<=6;l++){const s=levelStats(subject,l),required=requiredForLevel(subject,l);if(s.answered<required||s.rate<80)return l;}return 6;}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
  function setTab(view){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view));}
  function hideNav(){quizNav.classList.add('hidden');quizNav.innerHTML='';}
  function navigate(next){route=next;hideNav();window.scrollTo({top:0,behavior:'smooth'});render();}
  function render(){setTab(route.view);if(route.view==='home')renderHome();else if(route.view==='subject')renderSubject(route.subject);else if(route.view==='quiz')renderQuiz();else if(route.view==='result')renderResult();else if(route.view==='all')renderAll();else if(route.view==='parent')renderParent();}

  function renderHome(){
    const total=statsFor(questions),today=new Date().toISOString().slice(0,10),doneToday=Object.values(load().records).filter(r=>r.date===today).length;
    app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">每天十分鐘 · 一次一小步</div><h1>今天想去哪裡冒險？</h1><p>選一個科目，完成10題。答錯不是失敗，而是找到了下一個要練習的地方。</p></div><div class="today-card"><strong>${doneToday} 題</strong><span>今天已完成</span></div></section>
      <div class="section-title"><div><h2>三個學習世界</h2><p>每一科都有自己的進度，不必同時升級。</p></div><p>累計完成 ${total.attempts} 題次</p></div>
      <section class="subject-grid">${Object.entries(SUBJECTS).map(([key,m])=>{const l=currentLevel(key),s=levelStats(key,l),wrong=questions.filter(q=>q.subject===key&&load().records[q.id]?.wrong).length;return `<article class="subject-card ${m.class}"><div class="icon">${m.icon}</div><h3>${m.name}</h3><p>${m.desc}</p><div class="level-meta"><span>目前 LEVEL ${String(l).padStart(2,'0')}</span><span>${s.answered?`${s.rate}%`:'尚未開始'}</span></div><div class="meter"><i style="width:${s.rate}%"></i></div><div class="card-actions"><button class="btn primary" data-daily="${key}">開始10題</button><button class="btn soft" data-subject="${key}">選擇練習</button>${wrong?`<button class="btn warn" data-weak="${key}">弱項 ${wrong}</button>`:''}</div></article>`}).join('')}</section>`;
    app.querySelectorAll('[data-daily]').forEach(b=>b.onclick=()=>startDaily(b.dataset.daily));
    app.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>navigate({view:'subject',subject:b.dataset.subject}));
    app.querySelectorAll('[data-weak]').forEach(b=>b.onclick=()=>startWeak(b.dataset.weak));
  }
  function renderSubject(subject){const m=SUBJECTS[subject],cats=[...new Set(questions.filter(q=>q.subject===subject).map(q=>q.category))];app.innerHTML=`<div class="breadcrumb"><button data-home>首頁</button><span>›</span><span>${m.name}</span></div><section class="panel"><div class="subject-head"><div><div class="eyebrow">${m.icon} ${m.short}學習階梯</div><h1>${m.name}</h1><p class="note">可以依學校進度選級，也可以從系統建議的等級開始。</p></div><button class="btn primary" data-daily="${subject}">開始今日10題</button></div><div class="level-grid">${LEVELS.map(l=>{const s=levelStats(subject,l.level),total=levelTotal(subject,l.level),required=requiredForLevel(subject,l.level),pass=s.answered>=required&&s.rate>=80;return `<article class="level-card"><div class="level-top"><span class="level-no">LEVEL ${String(l.level).padStart(2,'0')} · ${l.stage}</span><span class="status ${pass?'pass':''}">${pass?'✓ 已達標':s.answered?'練習中':'可開始'}</span></div><h3>${l.name}</h3><p>${l.desc}</p><div class="meter"><i style="width:${s.rate}%"></i></div><div class="level-meta"><span>${s.answered}/${total}題</span><span>${s.answered?`目前 ${s.rate}%`:`達標需完成${required}題`}</span></div><button class="btn ${l.level===currentLevel(subject)?'primary':'soft'}" data-level="${l.level}">${s.answered?'繼續練習':'開始練習'}</button></article>`}).join('')}</div><div class="section-title"><div><h2>單項強化</h2><p>集中練一種能力，每次最多10題。</p></div></div><div class="focus-grid">${cats.map(c=>`<button class="focus-chip" data-focus="${esc(c)}">${esc(c)}</button>`).join('')}<button class="focus-chip" data-weak="${subject}">🎯 我的弱項</button></div></section>`;
    app.querySelector('[data-home]').onclick=()=>navigate({view:'home'});app.querySelector('[data-daily]').onclick=()=>startDaily(subject);app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startSession(questions.filter(q=>q.subject===subject&&q.level===+b.dataset.level),`${m.short} LEVEL ${String(b.dataset.level).padStart(2,'0')}`,'level'));app.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>startFocus(subject,b.dataset.focus));app.querySelector('[data-weak]').onclick=()=>startWeak(subject);
  }
  function startDaily(subject){const level=currentLevel(subject),base=questions.filter(q=>q.subject===subject&&q.level===level),wrongs=base.filter(q=>load().records[q.id]?.wrong),priority=shuffle(wrongs).slice(0,2),rest=base.filter(q=>!priority.includes(q));startSession([...priority,...shuffle(rest)].slice(0,10),`${SUBJECTS[subject].short}今日10題`,'daily');}
  function startFocus(subject,category){startSession(shuffle(questions.filter(q=>q.subject===subject&&q.category===category)).slice(0,10),`${SUBJECTS[subject].short}｜${category}`,'focus');}
  function startWeak(subject){const list=questions.filter(q=>q.subject===subject&&load().records[q.id]?.wrong);if(!list.length){alert('目前沒有待訂正的弱項。先完成一些題目，系統就能幫你找出來。');return;}startSession(shuffle(list).slice(0,10),`${SUBJECTS[subject].short}｜我的弱項`,'weak');}
  function startSession(list,title,kind){if(!list.length)return;session={ids:list.map(q=>q.id),title,kind,index:0,answers:{},startedAt:Date.now()};navigate({view:'quiz'});}
  function currentQuestion(){return questions.find(q=>q.id===session.ids[session.index]);}
  function renderQuiz(){if(!session){navigate({view:'home'});return;}const q=currentQuestion(),chosen=session.answers[q.id],has=chosen!==undefined;app.innerHTML=`<section class="quiz-wrap"><div class="quiz-head"><div><div class="eyebrow">${esc(session.title)}</div><h1>${SUBJECTS[q.subject].icon} ${SUBJECTS[q.subject].name}</h1></div><div class="quiz-count">第 ${session.index+1}／${session.ids.length} 題</div></div><div class="progress"><i style="width:${(session.index+1)/session.ids.length*100}%"></i></div><article class="question-card"><div class="question-meta"><span class="tag">${esc(q.category)}</span>${q.subject==='english'?`<button class="speak" data-speak="${esc(q.speak||q.prompt)}">🔊 聽一聽</button>`:''}</div><div class="prompt">${esc(q.prompt)}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice ${has?(i===q.answer?'correct':i===chosen?'wrong':''):''}" data-choice="${i}" ${has?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>${has?`<div class="feedback ${chosen===q.answer?'good':'try'}"><strong>${chosen===q.answer?'✓ 答對了！':'再看一次：正確答案是 '+q.choices[q.answer]}</strong><span>${esc(q.explanation)}</span></div>`:''}</article></section>`;
    app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(+b.dataset.choice));const sp=app.querySelector('[data-speak]');if(sp)sp.onclick=()=>speak(sp.dataset.speak);renderQuizNav(has);
  }
  function answer(choice){const q=currentQuestion();if(session.answers[q.id]!==undefined)return;session.answers[q.id]=choice;const s=load(),old=s.records[q.id]||{attempts:0,wrongCount:0};const correct=choice===q.answer;s.records[q.id]={attempts:old.attempts+1,wrongCount:(old.wrongCount||0)+(correct?0:1),correct,wrong:!correct,date:new Date().toISOString().slice(0,10),lastChoice:choice};s.lastSubject=q.subject;save(s);renderQuiz();}
  function renderQuizNav(has){quizNav.classList.remove('hidden');const last=session.index===session.ids.length-1;quizNav.innerHTML=`<div class="quiz-nav-inner"><button class="btn" id="quitQuiz">結束</button><button class="btn" id="prevQuiz" ${session.index===0?'disabled':''}>上一題</button><span class="nav-status">${session.index+1} / ${session.ids.length}</span><button class="btn primary" id="nextQuiz" ${has?'':'disabled'}>${last?'看結果':'下一題'}</button></div>`;document.getElementById('quitQuiz').onclick=()=>{if(confirm('要先結束這次練習嗎？已完成的題目會保存。'))navigate({view:'home'});};document.getElementById('prevQuiz').onclick=()=>{if(session.index>0){session.index--;renderQuiz();window.scrollTo({top:0,behavior:'smooth'});}};document.getElementById('nextQuiz').onclick=()=>{if(!has)return;if(last)navigate({view:'result'});else{session.index++;renderQuiz();window.scrollTo({top:0,behavior:'smooth'});}};}
  function renderResult(){hideNav();const list=session.ids.map(id=>questions.find(q=>q.id===id)),wrong=list.filter(q=>session.answers[q.id]!==q.answer),correct=list.length-wrong.length,rate=Math.round(correct/list.length*100),mins=Math.max(1,Math.round((Date.now()-session.startedAt)/60000));app.innerHTML=`<section class="panel result"><div class="big">${rate===100?'🌟':rate>=80?'🎉':'🌱'}</div><div class="eyebrow">本回練習完成</div><h1>${esc(session.title)}</h1><p>${rate===100?'全部答對，今天的練習很扎實！':rate>=80?'已經掌握大部分內容，再訂正錯題就更完整。':'我們找到了需要再練習的地方。'}</p><div class="result-grid"><div class="stat"><strong>${correct}/${list.length}</strong><span>答對題數</span></div><div class="stat"><strong>${rate}%</strong><span>本回正確率</span></div><div class="stat"><strong>${mins}分</strong><span>使用時間</span></div></div><div class="button-row">${wrong.length?`<button class="btn primary" id="retryWrong">只練錯題（${wrong.length}）</button>`:''}<button class="btn soft" id="again">再來一回</button><button class="btn" id="backHome">回首頁</button></div></section>`;if(wrong.length)document.getElementById('retryWrong').onclick=()=>startSession(wrong,session.title+'｜錯題訂正','retry');document.getElementById('again').onclick=()=>startSession(shuffle(list),session.title,session.kind);document.getElementById('backHome').onclick=()=>navigate({view:'home'});
  }
  function renderAll(){app.innerHTML=`<section class="panel"><div class="section-title"><div><h2>全部題目</h2><p>答案預設收合，適合家長查看題目內容。</p></div><strong>共 ${questions.length} 題</strong></div><div class="toolbar"><label>科目<select id="bankSubject"><option value="chinese">國文</option><option value="math">數學</option><option value="english">英文</option></select></label><label>等級<select id="bankLevel">${LEVELS.map(l=>`<option value="${l.level}">LEVEL ${String(l.level).padStart(2,'0')}</option>`).join('')}</select></label></div><div id="bankList" class="bank-list"></div></section>`;document.getElementById('bankSubject').onchange=renderBank;document.getElementById('bankLevel').onchange=renderBank;renderBank();}
  function renderBank(){const subject=document.getElementById('bankSubject').value,level=+document.getElementById('bankLevel').value,list=questions.filter(q=>q.subject===subject&&q.level===level);document.getElementById('bankList').innerHTML=list.map((q,i)=>`<details class="bank-item"><summary>No. ${String(i+1).padStart(2,'0')}｜${esc(q.prompt).replace(/\n/g,' ')}</summary><div class="bank-answer"><strong>答案：${'ABCD'[q.answer]}. ${esc(q.choices[q.answer])}</strong><p>${esc(q.explanation)}</p><small>${q.id} · ${esc(q.category)}</small></div></details>`).join('');}
  function renderParent(){const state=load(),all=statsFor(questions);app.innerHTML=`<section class="panel"><div class="section-title"><div><h2>家長專區</h2><p>正確率是觀察線索，不是孩子的標籤。</p></div></div><div class="stats-grid"><div class="stat"><strong>${all.attempts}</strong><span>累計作答題次</span></div><div class="stat"><strong>${all.answered?all.rate+'%':'—'}</strong><span>目前答對比例</span></div><div class="stat"><strong>${all.wrong}</strong><span>待訂正題目</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>科目</th><th>目前建議</th><th>已作答</th><th>目前答對</th><th>待訂正</th></tr></thead><tbody>${Object.entries(SUBJECTS).map(([key,m])=>{const subjectQuestions=questions.filter(q=>q.subject===key),s=statsFor(subjectQuestions);return `<tr><td>${m.icon} ${m.short}</td><td>LEVEL ${String(currentLevel(key)).padStart(2,'0')}</td><td>${s.answered}/${subjectQuestions.length}</td><td>${s.answered?s.rate+'%':'—'}</td><td>${s.wrong}</td></tr>`}).join('')}</tbody></table></div><div class="section-title"><div><h2>資料管理</h2><p>紀錄只保存在這個瀏覽器；可匯出備份後帶到另一台裝置。</p></div></div><div class="button-row"><button class="btn soft" id="exportData">匯出學習紀錄</button><button class="btn" id="importData">匯入學習紀錄</button><button class="btn danger" id="resetData">清除全部紀錄</button></div></section>`;document.getElementById('exportData').onclick=exportData;document.getElementById('importData').onclick=()=>document.getElementById('importFile').click();document.getElementById('resetData').onclick=()=>{if(confirm('確定清除全部學習紀錄嗎？這個動作無法還原。')){localStorage.removeItem(STORAGE_KEY);renderParent();}};}
  function exportData(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`小學習冒險_學習紀錄_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
  function speak(text){if(!('speechSynthesis'in window)){alert('這個瀏覽器目前不支援語音朗讀。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u);}
  document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.records||typeof data.records!=='object')throw new Error();save(Object.assign(defaultState(),data));alert('學習紀錄已匯入。');renderParent();}catch{alert('無法讀取這份學習紀錄。');}e.target.value='';};
  document.getElementById('brand').onclick=()=>navigate({view:'home'});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>navigate({view:b.dataset.view}));
  if(questions.length!==202)console.warn('題庫數量不是202題：',questions.length);
  render();
})();
</script>
</body>
</html>
