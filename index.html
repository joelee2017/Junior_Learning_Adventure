<body>
  <header class="topbar"><div class="shell topbar-inner">
    <button class="brand" id="brand"><strong>🌱 小學習冒險</strong><span>小一～小三・三科練習場</span></button>
    <nav class="tabs" aria-label="主要功能">
      <button class="tab active" data-view="home">首頁</button>
      <button class="tab" data-view="all">全部題目</button>
      <button class="tab" data-view="parent">家長專區</button>

  </div></header>
  <main class="shell" id="app"></main>
  <div id="quizNav" class="quiz-nav hidden"></div>
  <input id="importFile" type="file" accept="application/json" class="hidden">
<script>
(() => {
  'use strict';
  const STORAGE_KEY='kids-learning-adventure-v1';
  const LEVELS=[
    {level:1,grade:'小一',phase:'入門',name:'小一・入門',desc:'先看懂、認得，建立最初的學習連結。'},
    {level:2,grade:'小一',phase:'熟練',name:'小一・熟練',desc:'增加基礎題型變化並練習自行回想。'},
    {level:3,grade:'小一',phase:'綜合',name:'小一・綜合',desc:'把基礎知識放入句子與生活情境。'},
    {level:4,grade:'小二',phase:'入門',name:'小二・入門',desc:'銜接二年級需要的基本能力。'},
    {level:5,grade:'小二',phase:'熟練',name:'小二・熟練',desc:'增加變化並連接兩種以上的能力。'},
    {level:6,grade:'小二',phase:'綜合',name:'小二・綜合',desc:'閱讀、推理，再做出判斷。'},
    {level:7,grade:'小三',phase:'入門',name:'小三・入門',desc:'進入較長文字、多步驟計算與英文拼字。'},
    {level:8,grade:'小三',phase:'熟練',name:'小三・熟練',desc:'整合詞語、數量關係與完整句型。'},
    {level:9,grade:'小三',phase:'綜合',name:'小三・綜合',desc:'從閱讀情境中選擇方法並完成答案。'}
  ];
  const SUBJECTS={
    chinese:{name:'國文森林',short:'國文',icon:'📚',class:'chinese',desc:'注音、國字、詞語與閱讀理解'},
    math:{name:'數學島嶼',short:'數學',icon:'🔢',class:'math',desc:'數量、加減、圖形與生活應用'},
    english:{name:'英文字母城',short:'英文',icon:'🔤',class:'english',desc:'字母、單字、發音與簡單閱讀'}
  };
  const WRITING_PRACTICES=[
    {id:'W-一',char:'一',zhuyin:'ㄧ',word:'一個',strokes:[['第1筆：橫','M65 150 L235 150']]},
    {id:'W-二',char:'二',zhuyin:'ㄦˋ',word:'二人',strokes:[['第1筆：上橫','M85 105 L215 105'],['第2筆：下橫','M60 200 L240 200']]},
    {id:'W-三',char:'三',zhuyin:'ㄙㄢ',word:'三本書',strokes:[['第1筆：上橫','M90 80 L210 80'],['第2筆：中橫','M78 145 L222 145'],['第3筆：下橫','M55 220 L245 220']]},
    {id:'W-十',char:'十',zhuyin:'ㄕˊ',word:'十個',strokes:[['第1筆：橫','M60 140 L240 140'],['第2筆：豎','M150 55 L150 245']]},
    {id:'W-人',char:'人',zhuyin:'ㄖㄣˊ',word:'人口',strokes:[['第1筆：撇','M150 65 Q140 150 70 235'],['第2筆：捺','M145 125 Q175 190 235 235']]},
    {id:'W-大',char:'大',zhuyin:'ㄉㄚˋ',word:'大小',strokes:[['第1筆：橫','M60 120 L240 120'],['第2筆：撇','M155 60 Q145 160 70 240'],['第3筆：捺','M150 135 Q180 195 238 238']]},
    {id:'W-小',char:'小',zhuyin:'ㄒㄧㄠˇ',word:'大小',strokes:[['第1筆：豎鉤','M150 65 L150 210 Q150 232 128 216'],['第2筆：撇','M105 145 Q88 185 62 210'],['第3筆：點','M195 145 Q214 180 235 205']]},
    {id:'W-上',char:'上',zhuyin:'ㄕㄤˋ',word:'上面',strokes:[['第1筆：豎','M135 55 L135 225'],['第2筆：短橫','M135 125 L220 125'],['第3筆：長橫','M55 225 L245 225']]},
    {id:'W-下',char:'下',zhuyin:'ㄒㄧㄚˋ',word:'下面',strokes:[['第1筆：橫','M55 75 L245 75'],['第2筆：豎','M145 75 L145 238'],['第3筆：點','M165 145 Q195 170 220 195']]},
    {id:'W-口',char:'口',zhuyin:'ㄎㄡˇ',word:'人口',strokes:[['第1筆：左豎','M75 65 L75 235'],['第2筆：橫折','M75 65 L230 65 L230 235'],['第3筆：封口橫','M75 235 L230 235']]},
    {id:'W-日',char:'日',zhuyin:'ㄖˋ',word:'日子',strokes:[['第1筆：左豎','M80 45 L80 250'],['第2筆：橫折','M80 45 L225 45 L225 250'],['第3筆：中間橫','M80 145 L225 145'],['第4筆：封口橫','M80 250 L225 250']]},
    {id:'W-木',char:'木',zhuyin:'ㄇㄨˋ',word:'木頭',strokes:[['第1筆：橫','M55 125 L245 125'],['第2筆：豎','M150 50 L150 250'],['第3筆：撇','M148 130 Q115 190 60 230'],['第4筆：捺','M152 130 Q190 190 245 230']]},
    {id:'W-田',char:'田',zhuyin:'ㄊㄧㄢˊ',word:'田地',strokes:[['第1筆：左豎','M65 45 L65 250'],['第2筆：橫折','M65 45 L235 45 L235 250'],['第3筆：中間橫','M65 145 L235 145'],['第4筆：中間豎','M150 45 L150 250'],['第5筆：封口橫','M65 250 L235 250']]}
  ];
  const questions=[]; const counters={};
  function add(subject,level,category,prompt,answer,distractors,explanation,speak=''){
    const key=subject+level;counters[key]=(counters[key]||0)+1;
    const prefix={chinese:'C',math:'M',english:'E'}[subject];
    const id=`${prefix}${String(level).padStart(2,'0')}-${String(counters[key]).padStart(3,'0')}`;
    const choices=[answer,...distractors].slice(0,4);
    const shift=(counters[key]+level)%choices.length;
    const rotated=choices.slice(shift).concat(choices.slice(0,shift));
    questions.push({id,subject,level,category,type:'choice',prompt,choices:rotated,answer:rotated.indexOf(answer),explanation,speak});
  }
  function addSet(subject,level,category,rows){rows.forEach(r=>add(subject,level,category,...r));}
  function addBuild(subject,level,category,prompt,tokens,answerTokens,explanation,display='join'){
    const key=subject+level;counters[key]=(counters[key]||0)+1;
    const prefix={chinese:'C',math:'M',english:'E'}[subject];
    const id=`${prefix}${String(level).padStart(2,'0')}-${String(counters[key]).padStart(3,'0')}`;
    const shift=(counters[key]+level)%tokens.length;let arranged=tokens.slice(shift).concat(tokens.slice(0,shift));
    if(arranged.length>1&&arranged.every((x,i)=>x===answerTokens[i]))arranged=[...arranged].reverse();
    questions.push({id,subject,level,category,type:'build',prompt,tokens:arranged,answerTokens,explanation,display});
  }
  function addInput(subject,level,category,prompt,answers,explanation,placeholder='請輸入答案',speak=''){
    const key=subject+level;counters[key]=(counters[key]||0)+1;
    const prefix={chinese:'C',math:'M',english:'E'}[subject];
    const id=`${prefix}${String(level).padStart(2,'0')}-${String(counters[key]).padStart(3,'0')}`;
    questions.push({id,subject,level,category,type:'input',prompt,answers:Array.isArray(answers)?answers:[String(answers)],explanation,placeholder,speak});
  }

  function renderAll(){app.innerHTML=`<section class="panel"><div class="section-title"><div><h2>全部題目</h2><p>答案預設收合，適合家長查看題目內容。</p></div><strong>共 ${questions.length} 題</strong></div><div class="toolbar"><label>科目<select id="bankSubject"><option value="chinese">國文</option><option value="math">數學</option><option value="english">英文</option></select></label><label>年級與階段<select id="bankLevel">${LEVELS.map(l=>`<option value="${l.level}">${l.name}｜LEVEL ${String(l.level).padStart(2,'0')}</option>`).join('')}</select></label></div><div id="bankList" class="bank-list"></div></section>`;document.getElementById('bankSubject').onchange=renderBank;document.getElementById('bankLevel').onchange=renderBank;renderBank();}
  function renderBank(){const subject=document.getElementById('bankSubject').value,level=+document.getElementById('bankLevel').value,list=questions.filter(q=>q.subject===subject&&q.level===level),typeName={choice:'選擇題',build:'排列題',input:'輸入題'};document.getElementById('bankList').innerHTML=list.map((q,i)=>`<details class="bank-item"><summary>No. ${String(i+1).padStart(2,'0')}｜${esc(q.prompt).replace(/\n/g,' ')}</summary><div class="bank-answer"><strong>答案：${esc(correctText(q))}</strong><p>${esc(q.explanation)}</p><small>${q.id} · ${esc(q.category)} · ${typeName[q.type]||q.type}</small></div></details>`).join('');}
  function renderParent(){const state=load(),all=statsFor(questions),writing=Object.values(state.writingRecords||{}),writingTimes=writing.reduce((n,r)=>n+(r.count||0),0);app.innerHTML=`<section class="panel"><div class="section-title"><div><h2>家長專區</h2><p>正確率是觀察線索，不是孩子的標籤；書寫練習另外記錄。</p></div></div><div class="stats-grid"><div class="stat"><strong>${all.attempts}</strong><span>累計作答題次</span></div><div class="stat"><strong>${all.answered?all.rate+'%':'—'}</strong><span>目前答對比例</span></div><div class="stat"><strong>${all.wrong}</strong><span>待訂正題目</span></div><div class="stat"><strong>${writing.length}/${WRITING_PRACTICES.length}</strong><span>書寫字已練｜共${writingTimes}次</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>科目</th><th>目前階段</th><th>熟練度</th><th>已作答</th><th>目前答對</th><th>待訂正</th></tr></thead><tbody>${Object.entries(SUBJECTS).map(([key,m])=>{const subjectQuestions=questions.filter(q=>q.subject===key),s=statsFor(subjectQuestions),level=currentLevel(key),mastery=masteryFor(key,level);return `<tr><td>${m.icon} ${m.short}</td><td>${levelLabel(level)}<br><small>LEVEL ${String(level).padStart(2,'0')}</small></td><td class="stars">${'★'.repeat(mastery.stars)}${'☆'.repeat(3-mastery.stars)}</td><td>${s.answered}/${subjectQuestions.length}</td><td>${s.answered?s.rate+'%':'—'}</td><td>${s.wrong}</td></tr>`}).join('')}</tbody></table></div><div class="section-title"><div><h2>資料管理</h2><p>紀錄只保存在這個瀏覽器；可匯出備份後帶到另一台裝置。</p></div></div><div class="button-row"><button class="btn soft" id="exportData">匯出學習紀錄</button><button class="btn" id="importData">匯入學習紀錄</button><button class="btn danger" id="resetData">清除全部紀錄</button></div></section>`;document.getElementById('exportData').onclick=exportData;document.getElementById('importData').onclick=()=>document.getElementById('importFile').click();document.getElementById('resetData').onclick=()=>{if(confirm('確定清除全部學習紀錄嗎？這個動作無法還原。')){localStorage.removeItem(STORAGE_KEY);renderParent();}};}
  function exportData(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`小學習冒險_學習紀錄_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
  function speak(text){if(!('speechSynthesis'in window)){alert('這個瀏覽器目前不支援語音朗讀。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u);}
  document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.records||typeof data.records!=='object')throw new Error();save(Object.assign(defaultState(),data));alert('學習紀錄已匯入。');renderParent();}catch{alert('無法讀取這份學習紀錄。');}e.target.value='';};
  document.getElementById('brand').onclick=()=>navigate({view:'home'});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>navigate({view:b.dataset.view}));
  if(questions.length!==1620)console.warn('題庫數量不是1620題：',questions.length);
  render();
})();
</script>
</body>
</html>
